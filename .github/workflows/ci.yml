name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test infra/prod/deploy.test.mjs infra/prod/process-nightly.test.mjs

      # Next generates typed route declarations inside `.next`. Running a web
      # typecheck alongside the build triggered by its tests can read that file
      # mid-generation and reject a valid newly added route.
      - run: pnpm turbo typecheck lint
      - run: pnpm turbo build
      - run: pnpm turbo test

  # Pushes to main that pass CI are deployed to the production server: SSH in with
  # a key whose authorized_keys entry forces infra/prod/deploy.sh (git pull +
  # build images, migrate database, restart web/document worker). Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy -o BatchMode=yes "seap@$DEPLOY_HOST"
      # Anonymous pages are cached at Cloudflare for 10 minutes (docs/handover/05-operations.md): cached HTML names the
      # previous build's JavaScript files, so a deploy empties the cache. The token may only purge this zone's cache;
      # until the owner adds it, the job warns and the cache is purged by hand (Caching → Configuration).
      - name: Purge the Cloudflare cache
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: f20aa2b73bef89aafa1eec34fe4cb5b9
        run: |
          if [ -z "$CLOUDFLARE_PURGE_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PURGE_TOKEN is not set: purge the Cloudflare cache by hand (Caching → Configuration → Purge Everything)."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -q '"success":true'
